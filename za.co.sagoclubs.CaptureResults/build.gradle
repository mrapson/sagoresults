plugins {
    id 'com.android.application'
}

def secretPropertiesFile = rootProject.file("secret.properties")
def secretProperties = new Properties()
secretProperties.load(new FileInputStream(secretPropertiesFile))

android {
    namespace 'za.co.sagoclubs'
    compileSdk 34
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "za.co.sagoclubs"
        minSdk 33
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "PROD_RATINGS_SITE", secretProperties['PROD_RATINGS_SITE'])
        buildConfigField("String", "PROD_RANK_SITE", secretProperties['PROD_RANK_SITE'])
        buildConfigField("String", "PROD_COGNITO_POOL_ID", secretProperties['PROD_COGNITO_POOL_ID'])
        buildConfigField("String", "PROD_COGNITO_CLIENT_ID", secretProperties['PROD_COGNITO_CLIENT_ID'])
        buildConfigField("String", "PROD_COGNITO_CLIENT_SECRET", secretProperties['PROD_COGNITO_CLIENT_SECRET'])
        buildConfigField("String", "PROD_COGNITO_AWS_REGION", secretProperties['PROD_COGNITO_AWS_REGION'])
        buildConfigField("String", "TEST_RATINGS_SITE", secretProperties['TEST_RATINGS_SITE'])
        buildConfigField("String", "TEST_RANK_SITE", secretProperties['TEST_RANK_SITE'])
        buildConfigField("String", "TEST_COGNITO_POOL_ID", secretProperties['TEST_COGNITO_POOL_ID'])
        buildConfigField("String", "TEST_COGNITO_CLIENT_ID", secretProperties['TEST_COGNITO_CLIENT_ID'])
        buildConfigField("String", "TEST_COGNITO_CLIENT_SECRET", secretProperties['TEST_COGNITO_CLIENT_SECRET'])
        buildConfigField("String", "TEST_COGNITO_AWS_REGION", secretProperties['TEST_COGNITO_AWS_REGION'])
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }
}

dependencies {
    implementation 'com.amazonaws:aws-android-sdk-core:2.81.1'
    implementation 'com.amazonaws:aws-android-sdk-cognitoidentityprovider:2.81.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation 'org.jsoup:jsoup:1.18.1'
}